draw_config:
  key_w: 60.0
  key_h: 56.0
  dark_mode: true
  n_columns: 1
  shrink_wide_legends: 7
parse_config:
  preprocess: true
  raw_binding_map:
      # Lettres
      "&kp Q": "A"
      "&kp W": "Z"
      "&kp A": "Q"
      "&kp Z": "W"
      "&kp M": ","      # Le M physique devient la virgule
      "&kp COMMA": "M"  # La virgule physique devient le M
      "&kp DOT": ":"    # Le point devient deux-points (ou point selon ton driver)
      "&kp SLASH": "!"  # Le slash devient point d'exclamation
  
      # Chiffres (La rangée du haut sans Shift)
      "&kp N1": "&"
      "&kp N2": "é"
      "&kp N3": '"'
      "&kp N4": "'"
      "&kp N5": "("
      "&kp N6": "§"
      "&kp N7": "è"
      "&kp N8": "!"
      "&kp N9": "ç"
      "&kp N0": "à"
