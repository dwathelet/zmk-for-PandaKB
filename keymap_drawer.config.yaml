# keymap_drawer.config.yaml
parse_config:
  raw_binding_map:
    "&td_numpad": "LOWER"
    "&mo RAISE": "RAISE"

draw_config:
  dark_mode: true
  # On oublie les labels, on donne les positions exactes des touches
  layer_hints:
    "lower":
      - {index: 40, state: held}
    "raise":
      - {index: 41, state: held}
    "adjust":
      - {index: 40, state: held}
      - {index: 41, state: held}
