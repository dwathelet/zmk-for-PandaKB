# keymap_drawer.config.yaml
parse_config:
  raw_binding_map:
    "&td_numpad": "LOWER_KEY"
    "&mo RAISE": "RAISE_KEY"

draw_config:
  dark_mode: true
  
  # On force manuellement le rouge (held) uniquement là où c'est vrai
  layer_hints:
    "lower":
      - {label: "LOWER_KEY", state: held}
    "raise":
      - {label: "RAISE_KEY", state: held}
    "adjust":
      - {label: "LOWER_KEY", state: held}
      - {label: "RAISE_KEY", state: held}

  # Pour que le texte affiché soit propre
  mapped_symbols:
    "LOWER_KEY": "LOWER"
    "RAISE_KEY": "RAISE"
