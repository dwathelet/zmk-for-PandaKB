# keymap_drawer.config.yaml
parse_config:
  raw_binding_map:
    # On donne un nom unique à la liaison pour pouvoir la cibler
    "&td_numpad": "LWR_KEY"

draw_config:
  layer_hints:
    # On dit explicitement : sur la couche 'lower', 
    # la touche qui contient "LWR_KEY" doit être rouge (held)
    "lower":
      "LWR_KEY": held
  
  # Optionnel : pour que le texte soit joli sur le dessin
  mapped_symbols:
    "LWR_KEY": "LOWER"
