# Rendu du keymap tel qu'il apparaît sous la disposition AZERTY belge du système.
# Le firmware envoie des codes de touches QWERTY ; ces tables affichent le
# caractère réellement obtenu.

draw_config:
  key_w: 60.0
  key_h: 56.0
  dark_mode: true
  n_columns: 1
  shrink_wide_legends: 7

parse_config:
  preprocess: true
  trans_legend: {t: "▽", type: trans}

  modifier_fn_map:
    left_ctrl: Ctrl
    right_ctrl: Ctrl
    left_shift: Shift
    right_shift: Shift
    left_alt: Alt
    right_alt: AltGr
    left_gui: Super
    right_gui: Super

  # Code de touche seul -> caractère en AZERTY belge.
  zmk_keycode_map:
    # Lettres déplacées
    Q: A
    A: Q
    W: Z
    Z: W
    M: ","
    SEMI: M
    SEMICOLON: M
    COMMA: ";"
    DOT: ":"
    PERIOD: ":"
    FSLH: "="
    SLASH: "="
    SQT: ù
    SINGLE_QUOTE: ù
    APOS: ù
    # Rangée des chiffres sans Shift
    N1: "&"
    N2: é
    N3: '"'
    N4: "'"
    N5: (
    NUMBER_5: (
    N6: §
    N7: è
    N8: "!"
    N9: ç
    N0: à
    # Ponctuation
    MINUS: )
    UNDERSCORE: °
    EQUAL: "-"
    LEFT_BRACKET: ^
    LBKT: ^
    RIGHT_BRACKET: $
    RBKT: $
    BACKSLASH: µ
    BSLH: µ
    NUBS: <
    NON_US_BACKSLASH: <
    # Touches spéciales
    TAB: Tab
    BSPC: ⌫
    BACKSPACE: ⌫
    DEL: Suppr
    DELETE: Suppr
    INS: Inser
    INSERT: Inser
    ESC: Échap
    ESCAPE: Échap
    ENTER: Entrée
    RET: Entrée
    RETURN: Entrée
    SPACE: Espace
    LSHFT: Shift
    LSHIFT: Shift
    LEFT_SHIFT: Shift
    RIGHT_SHIFT: Shift
    LCTRL: Ctrl
    RCTRL: Ctrl
    LEFT_CONTROL: Ctrl
    LGUI: Super
    LEFT_GUI: Super
    RIGHT_GUI: Super
    LALT: Alt
    LEFT_ALT: Alt
    RALT: AltGr
    LEFT_ARROW: ←
    LEFT: ←
    DOWN_ARROW: ↓
    DOWN: ↓
    UP_ARROW: ↑
    UP: ↑
    RIGHT_ARROW: →
    RIGHT: →
    HOME: Début
    END: Fin
    PAGE_UP: Pg↑
    PAGE_DOWN: Pg↓
    PSCRN: Impr
    C_VOL_UP: Vol+
    C_VOL_DN: Vol−
    C_MUTE: Muet
    C_PP: ⏯

  # Combinaisons complètes -> caractère ou action obtenus.
  raw_binding_map:
    # Chiffres (Shift + rangée du haut)
    "&kp LS(N1)": "1"
    "&kp LS(N2)": "2"
    "&kp LS(N3)": "3"
    "&kp LS(N4)": "4"
    "&kp LS(N5)": "5"
    "&kp LS(N6)": "6"
    "&kp LS(N7)": "7"
    "&kp LS(N8)": "8"
    "&kp LS(N9)": "9"
    "&kp LS(N0)": "0"
    # Symboles AltGr
    "&kp RA(N1)": "|"
    "&kp RA(N2)": "@"
    "&kp RA(N3)": "#"
    "&kp RA(N9)": "{"
    "&kp RA(N0)": "}"
    "&kp RA(E)": "€"
    "&kp RA(LEFT_BRACKET)": "["
    "&kp RA(RIGHT_BRACKET)": "]"
    "&kp LS(NUBS)": ">"
    "&kp RA(NUBS)": \
    "&tilde": "~"
    "&backtick": "`"
    # Couche BUREAU (raccourcis Omarchy)
    "&kp LG(N1)": {t: "1", h: bureau}
    "&kp LG(N2)": {t: "2", h: bureau}
    "&kp LG(N3)": {t: "3", h: bureau}
    "&kp LG(N4)": {t: "4", h: bureau}
    "&kp LG(N5)": {t: "5", h: bureau}
    "&kp LG(N6)": {t: "6", h: bureau}
    "&kp LG(N7)": {t: "7", h: bureau}
    "&kp LG(N8)": {t: "8", h: bureau}
    "&kp LG(N9)": {t: "9", h: bureau}
    "&kp LG(N0)": {t: "10", h: bureau}
    "&kp LG(LS(N1))": {t: "→1", h: envoyer}
    "&kp LG(LS(N2))": {t: "→2", h: envoyer}
    "&kp LG(LS(N3))": {t: "→3", h: envoyer}
    "&kp LG(LS(N4))": {t: "→4", h: envoyer}
    "&kp LG(LS(N5))": {t: "→5", h: envoyer}
    "&kp LG(LS(N6))": {t: "→6", h: envoyer}
    "&kp LG(LS(N7))": {t: "→7", h: envoyer}
    "&kp LG(LS(N8))": {t: "→8", h: envoyer}
    "&kp LG(LS(N9))": {t: "→9", h: envoyer}
    "&kp LG(LS(N0))": {t: "→10", h: envoyer}
    "&kp LG(LEFT)": {t: "←", h: focus}
    "&kp LG(DOWN)": {t: "↓", h: focus}
    "&kp LG(UP)": {t: "↑", h: focus}
    "&kp LG(RIGHT)": {t: "→", h: focus}
    "&kp F9": {t: F9, h: dictée}
    # Couche REGLAGES
    "&bootloader": Bootloader
    "&sys_reset": Reset
    "&bt BT_CLR": {t: BT, h: effacer}
    "&bt BT_SEL 0": {t: BT 1}
    "&bt BT_SEL 1": {t: BT 2}
    "&bt BT_SEL 2": {t: BT 3}
    "&bt BT_SEL 3": {t: BT 4}
    "&bt BT_SEL 4": {t: BT 5}
    "&rgb_ug RGB_TOG": {t: RGB, h: on/off}
    "&rgb_ug RGB_BRI": {t: RGB, h: lum+}
    "&rgb_ug RGB_BRD": {t: RGB, h: lum−}
    "&rgb_ug RGB_EFF": {t: RGB, h: effet}
