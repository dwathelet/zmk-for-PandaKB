# keymap_drawer.config.yaml
parse_config:
  # Étape 1 : On change le label pour qu'il ne ressemble pas exactement au nom du layer
  raw_binding_map:
    "&td_numpad": {t: "LWR/NUM"} 

draw_config:
  dark_mode: true
  # Étape 2 : On dit de colorier la touche "LWR/NUM" UNIQUEMENT sur la couche "lower"
  layer_hints:
    "lower":
      "LWR/NUM": held
