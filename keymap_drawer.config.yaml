# keymap_drawer.config.yaml
draw_config:
  # Style pour les touches marquées comme "held"
  svg_extra_style: |
    rect.held { fill: #fbd5e5 !important; stroke: #ff006e !important; }
    text.held { fill: #ff006e !important; font-weight: bold; }
    
    /* Optionnel : style pour les combos */
    rect.combo { fill: #e0e0ff !important; }

  key_w: 60
  key_h: 56
  split_gap: 30

parse_config:
  # Mapping automatique des comportements ZMK vers la classe CSS "held"
  raw_binding_map:
    "&mo 1": {t: "Lower", c: "held"}
    "&mo 2": {t: "Raise", c: "held"}
    "&td0": {t: "TD(0)", c: "held"}
