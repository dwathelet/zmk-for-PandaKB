# keymap_drawer.config.yaml
parse_config:
  raw_binding_map:
    "&td_numpad": "LWR_KEY"

draw_config:
  # On force l'état "maintenu" (rouge) spécifiquement pour le texte LWR_KEY
  # uniquement sur le diagramme de la couche "lower"
  layer_hints:
    "lower":
      - {label: "LWR_KEY", state: held}

  # Pour que ce soit propre visuellement sur le clavier
  mapped_symbols:
    "LWR_KEY": "LOWER"
