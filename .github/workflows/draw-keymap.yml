name: Draw Keymap
on: [push, workflow_dispatch]

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial pour que l'action puisse enregistrer l'image sur ton repo
    steps:
      - uses: actions/checkout@v4
      
      - name: Install and Draw
        uses: caksoylar/keymap-drawer-action@v1
        with:
          keymap_path: "config/Sofle.keymap" # Vérifie bien la majuscule sur S de Sofle
          output_path: "keymap_display.svg"
          draw_args: "sofle:v2" # Aide l'outil à reconnaître la forme physique du Sofle
